# =============================================================================
# Handcrafted Hearthwood — full-stack stack
#
#   postgres  — primary datastore (SQLAlchemy/asyncpg, alembic migrations)
#   redis     — ephemeral shopping carts + traffic analytics counters
#   minio     — S3-compatible object storage for media
#   backend   — FastAPI API (built from ./backend) on :8010
#   frontend  — TanStack Start storefront/admin (built from ./frontend) on :8080
#
# Secrets are injected from the root `.env` (copy `.env.example` first).
# Compose FAILS FAST if a required variable is missing — by design.
#
#   docker compose up -d --build
# =============================================================================

name: hearthwood

services:
  # --- Infrastructure --------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: hh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hh_net

  redis:
    image: redis:7-alpine
    container_name: hh_redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}' --no-auth-warning ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - hh_net

  minio:
    # NOTE: MinIO removed `minio/minio` from Docker Hub (2025-09). The
    # official public image now lives on quay.io. Pinned to a specific
    # RELEASE tag for reproducibility.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: hh_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hh_net

  # --- Application -----------------------------------------------------------

  backend:
    build:
      context: ./backend
    image: hearthwood-backend
    container_name: hh_backend
    restart: unless-stopped
    # The backend only starts once every dependency is genuinely healthy.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DEBUG: ${DEBUG:-false}
      # --- PostgreSQL (in-network service name, not localhost) ---
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
      # --- Redis ---
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required (see .env.example)}
      REDIS_DB: ${REDIS_DB:-0}
      # --- MinIO / S3 (S3 keys default to the MinIO root credentials) ---
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${MINIO_ROOT_USER:?MINIO_ROOT_USER is required (see .env.example)}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required (see .env.example)}}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-hearthwood-media}
      # Public host the BROWSER uses to fetch media (the backend itself
      # talks to minio:9000 internally). On a VPS behind a CDN/proxy, set
      # MEDIA_PUBLIC_URL to that public origin.
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-http://localhost:9000}
      # --- CORS: JSON list of allowed browser origins ---
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      # --- Secure OTP auth: api.ir gateway + JWT ---
      # Empty API_IR_TOKEN => /auth/request-otp answers 503 and never calls
      # the paid provider (zero cost until the token is configured).
      API_IR_TOKEN: ${API_IR_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
    ports:
      - "${BACKEND_PORT:-8010}:8010"
    volumes:
      # The seed reads the catalog imagery from the frontend's public assets
# (site-root JPGs — see frontend/public).
      - ./frontend/public:/frontend/public:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/openapi.json', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - hh_net

  frontend:
    build:
      context: ./frontend
      args:
        NITRO_PRESET: node-server
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api/v1}
    image: hearthwood-frontend
    container_name: hh_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_PORT: "8080"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010/api/v1}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hh_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  hh_net:
    driver: bridge